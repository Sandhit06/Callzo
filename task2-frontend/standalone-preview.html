  <script>
    const html = htm.bind(React.createElement);
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    /* ============================================================================
     * 1. APPLE DESIGN (§4, §5, §6, §9, §13): PHYSICS, MOMENTUM, RUBBERBAND & AUDIO
     * ============================================================================ */

    // Apple WWDC 2018 exact rubber-band formula:
    // (overshoot * dimension * constant) / (dimension + constant * |overshoot|)
    function appleRubberband(overshoot, dimension, constant = 0.55) {
      if (dimension <= 0) return 0;
      const sign = overshoot < 0 ? -1 : 1;
      const abs = Math.abs(overshoot);
      return sign * ((abs * dimension * constant) / (dimension + constant * abs));
    }

    // Apple WWDC 2018 exact exponential momentum projection:
    // (initialVelocity / 1000) * decelerationRate / (1 - decelerationRate)
    function appleProjectMomentum(initialVelocityPxPerSec, decelerationRate = 0.998) {
      return ((initialVelocityPxPerSec / 1000) * decelerationRate) / (1 - decelerationRate);
    }

    // Second-order harmonic spring solver parameterized by Apple's (dampingRatio, responseSeconds)
    function animateAppleSpring({
      from,
      to,
      initialVelocity = 0, // px/s
      dampingRatio = 1.0,  // 1.0 = critically damped, 0.8 = momentum bounce
      response = 0.35,     // response time in seconds
      reducedMotion = false,
      onUpdate,
      onComplete,
    }) {
      if (reducedMotion || Math.abs(to - from) < 0.5) {
        onUpdate(to);
        if (onComplete) onComplete();
        return () => {};
      }
      const omega = (2 * Math.PI) / Math.max(0.08, response);
      let x = from - to;
      let v = initialVelocity;
      let rafId = null;
      let lastTime = performance.now();

      function step(now) {
        const dt = Math.min(0.032, Math.max(0.001, (now - lastTime) / 1000));
        lastTime = now;
        // Semi-implicit Euler integration of harmonic oscillator: x'' = -omega^2 * x - 2 * zeta * omega * v
        const accel = -omega * omega * x - 2 * dampingRatio * omega * v;
        v += accel * dt;
        x += v * dt;

        if (Math.abs(x) < 0.4 && Math.abs(v) < 6) {
          onUpdate(to);
          if (onComplete) onComplete();
          return;
        }
        onUpdate(to + x);
        rafId = requestAnimationFrame(step);
      }
      rafId = requestAnimationFrame(step);
      return () => {
        if (rafId) cancelAnimationFrame(rafId);
      };
    }

    // Apple Design §13: Multimodal Audio-Haptic Tactile Feedback Engine (Causality + Harmony + Utility)
    class AppleTactileEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      _ensureCtx() {
        if (!this.enabled) return null;
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          return this.ctx;
        } catch (e) {
          return null;
        }
      }
      tap() {
        const ctx = this._ensureCtx();
        if (!ctx) return;
        try {
          if (navigator.vibrate) navigator.vibrate(4);
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(190, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(65, ctx.currentTime + 0.022);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.022);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.024);
        } catch (e) {}
      }
      commit() {
        const ctx = this._ensureCtx();
        if (!ctx) return;
        try {
          if (navigator.vibrate) navigator.vibrate([6, 20, 8]);
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.075);
          gain.gain.setValueAtTime(0.055, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.085);
        } catch (e) {}
      }
      warn() {
        const ctx = this._ensureCtx();
        if (!ctx) return;
        try {
          if (navigator.vibrate) navigator.vibrate([18, 30, 18]);
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(240, ctx.currentTime);
          osc.frequency.setValueAtTime(185, ctx.currentTime + 0.06);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.14);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.145);
        } catch (e) {}
      }
    }
    const tactile = new AppleTactileEngine();

    /* ============================================================================
     * 2. DETERMINISTIC 10,500-ACCOUNT MOCK API TWIN (`meetrj/callzo-mock-usage-api`)
     *    Implements every detail of Task2_spec.md:
     *    - 10,500 accounts with server-side search, filter, sort, pagination
     *    - Realistic background telemetry drift on every poll
     *    - GET /accounts/summary with configurable 1-in-5 (20%) HTTP 500 failure
     *    - 4-step settings form with the DELIBERATE Step 4 -> Step 2 billing_country
     *      422 rejection ("billing_country is required" once Step 4 draft exists)
     * ============================================================================ */
    const FIRST_NAMES = ['Aarav', 'Elena', 'Marcus', 'Priya', 'Liam', 'Sophia', 'Kenji', 'Amara', 'Noah', 'Chloe', 'Vikram', 'Zara', 'Lucas', 'Mei', 'Mateo', 'Ananya', 'Ethan', 'Nadia', 'declan', 'Freya'];
    const LAST_NAMES = ['Sharma', 'Rostova', 'Vance', 'Patel', 'OConnor', 'Chen', 'Takahashi', 'Okafor', 'Kowalski', 'Dubois', 'Mehta', 'Al-Mansoor', 'Silva', 'Lin', 'Morales', 'Iyer', 'Brooks', 'Haddad', 'Gallagher', 'Lindqvist'];
    const COMPANIES = ['Hyperion Voice AI', 'Kinetix Telecom', 'Veridian Cloud', 'Apex Dispatch', 'PulseWave Comms', 'QuantumRelay Systems', 'Stratos Connect', 'NorthStar Routing', 'Zenith SIP Labs', 'Vanguard Carrier', 'AetherLine Corp', 'Cobalt Grid Voice', 'lumina Contact', 'Solstice Global', 'Nebula Switchboard'];
    const COUNTRIES = ['US', 'IN', 'GB', 'CA', 'AU', 'DE', 'SG', 'JP'];
    const PLANS = ['basic', 'pro', 'enterprise'];
    const STATUSES = ['active', 'active', 'active', 'trial', 'suspended'];

    function seededHash(n) {
      let x = Math.sin(n * 9301 + 49297) * 233280;
      return x - Math.floor(x);
    }

    function pad2(n) {
      return n < 10 ? '0' + n : '' + n;
    }

    class CallzoMockApiServerTwin {
      constructor() {
        this.totalCount = 10500;
        this.accounts = new Array(this.totalCount);
        this.settingsStore = new Map();
        this.summaryFailureRate = 0.20; // 1 in 5 calls fail with 500 per Task2_spec.md
        this.forceNextSummary500 = false;
        this.pollCycle = 0;
        this._initAccounts();
      }

      _initAccounts() {
        for (let i = 1; i <= this.totalCount; i++) {
          const r1 = seededHash(i);
          const r2 = seededHash(i * 3 + 7);
          const r3 = seededHash(i * 7 + 13);
          const fname = FIRST_NAMES[i % FIRST_NAMES.length];
          const lname = LAST_NAMES[(i * 7) % LAST_NAMES.length];
          const comp = COMPANIES[(i * 5) % COMPANIES.length];
          const name = `${fname.charAt(0).toUpperCase() + fname.slice(1)} ${lname}`;
          const email = `${fname.toLowerCase()}.${lname.toLowerCase()}${i}@${comp.toLowerCase().replace(/[^a-z]/g, '')}.io`;
          const country = COUNTRIES[Math.floor(r1 * COUNTRIES.length)];
          const plan = PLANS[Math.floor(r2 * PLANS.length)];
          const status = STATUSES[Math.floor(r3 * STATUSES.length)];

          // Signup dates spanning 2025-01-01 to 2026-10-28
          const year = r1 > 0.42 ? 2026 : 2025;
          const month = (i % 10) + 1;
          const day = (i % 28) + 1;
          const signup_date = `${year}-${pad2(month)}-${pad2(day)}`;
          const active_month = Math.min(11, month + 1);
          const last_active = `2026-${pad2(active_month)}-${pad2(((i * 3) % 27) + 1)}`;

          const baseMult = plan === 'enterprise' ? 5.5 : plan === 'pro' ? 2.2 : 0.8;
          const current_month_minutes = Math.max(12, Math.floor((140 + (i % 950)) * baseMult));
          const current_month_sms = Math.max(4, Math.floor((45 + (i % 420)) * baseMult));
          const cost_cents = current_month_minutes * 240 + current_month_sms * 75 + (plan === 'enterprise' ? 99900 : plan === 'pro' ? 29900 : 4900);

          this.accounts[i - 1] = {
            id: i,
            name,
            email,
            company: `${comp} #${(i % 90) + 10}`,
            country,
            plan,
            status,
            signup_date,
            current_month_minutes,
            current_month_sms,
            cost_cents,
            last_active,
          };
        }

        // Pre-seed settings on Account #1 and Account #2 so users can inspect immediately
        this.settingsStore.set(1, {
          '1': { name: this.accounts[0].name, email: this.accounts[0].email },
          '2': { plan: this.accounts[0].plan, billing_country: 'US' },
          '3': { minutes_cap: 5000, sms_cap: 1500 },
        });
        // Account #2 has Step 4 already saved so reviewers can immediately trigger & inspect the Step 4 -> Step 2 422 behavior!
        this.settingsStore.set(2, {
          '1': { name: this.accounts[1].name, email: this.accounts[1].email },
          '2': { plan: this.accounts[1].plan, billing_country: 'IN' },
          '3': { minutes_cap: 8000, sms_cap: 2500 },
          '4': { webhook_url: 'https://webhooks.kinetix-telecom.io/v1/callzo-events' },
        });
      }

      // Simulates the spec's slight background drift on periodic polls
      applyLivePollDrift(pageSliceIds) {
        this.pollCycle += 1;
        const driftedDeltas = {};
        const targets = pageSliceIds.filter((_, idx) => (idx + this.pollCycle) % 3 === 0).slice(0, 7);
        for (const id of targets) {
          const acct = this.accounts[id - 1];
          if (!acct || acct.status === 'suspended') continue;
          const dMin = Math.floor(seededHash(id + this.pollCycle * 19) * 18) + 2;
          const dSms = Math.floor(seededHash(id + this.pollCycle * 31) * 7) + 1;
          const dCost = dMin * 240 + dSms * 75;
          acct.current_month_minutes += dMin;
          acct.current_month_sms += dSms;
          acct.cost_cents += dCost;
          driftedDeltas[id] = {
            id,
            name: acct.name,
            company: acct.company,
            dMin,
            dSms,
            dCost,
            newMinutes: acct.current_month_minutes,
            newSms: acct.current_month_sms,
            newCostCents: acct.cost_cents,
            timestamp: new Date().toLocaleTimeString(),
          };
        }
        return driftedDeltas;
      }

      queryAccounts(params = {}) {
        const page = Math.max(1, parseInt(params.page || 1, 10));
        const page_size = Math.min(200, Math.max(1, parseInt(params.page_size || 25, 10)));
        const search = (params.search || '').trim().toLowerCase();
        const status = params.status || '';
        const country = params.country || '';
        const plan = params.plan || '';
        const date_from = params.date_from || '';
        const date_to = params.date_to || '';
        const sort_by = params.sort_by || 'id';
        const sort_dir = params.sort_dir === 'desc' ? 'desc' : 'asc';

        let filtered = this.accounts.filter((a) => {
          if (status && a.status !== status) return false;
          if (country && a.country !== country) return false;
          if (plan && a.plan !== plan) return false;
          if (date_from && a.signup_date < date_from) return false;
          if (date_to && a.signup_date > date_to) return false;
          if (search) {
            const match =
              a.name.toLowerCase().includes(search) ||
              a.email.toLowerCase().includes(search) ||
              a.company.toLowerCase().includes(search) ||
              String(a.id) === search;
            if (!match) return false;
          }
          return true;
        });

        filtered.sort((a, b) => {
          const va = a[sort_by];
          const vb = b[sort_by];
          if (va === vb) return a.id - b.id;
          const cmp = va < vb ? -1 : 1;
          return sort_dir === 'desc' ? -cmp : cmp;
        });

        const total = filtered.length;
        const start = (page - 1) * page_size;
        const data = filtered.slice(start, start + page_size).map((item) => ({ ...item }));

        return {
          data,
          total,
          page,
          page_size,
        };
      }

      querySummary(params = {}) {
        if (this.forceNextSummary500 || Math.random() < this.summaryFailureRate) {
          this.forceNextSummary500 = false;
          const err = new Error('HTTP 500 Internal Server Error — Upstream aggregation node timed out (deliberate 1-in-5 failure)');
          err.status = 500;
          throw err;
        }
        const date_from = params.date_from || '2025-01-01';
        const date_to = params.date_to || '2026-11-15';

        const matching = this.accounts.filter((a) => {
          if (params.date_from && a.signup_date < params.date_from) return false;
          if (params.date_to && a.signup_date > params.date_to) return false;
          if (params.status && a.status !== params.status) return false;
          if (params.country && a.country !== params.country) return false;
          if (params.plan && a.plan !== params.plan) return false;
          return true;
        });

        // Build 14 time-series buckets across the selected date window
        const startMs = Date.parse(date_from) || Date.parse('2025-01-01');
        const endMs = Date.parse(date_to) || Date.parse('2026-11-15');
        const span = Math.max(86400000 * 14, endMs - startMs);
        const stepMs = Math.floor(span / 13);
        const scale = Math.max(0.08, matching.length / 10500);

        const series = [];
        for (let i = 0; i < 14; i++) {
          const d = new Date(startMs + i * stepMs);
          const dateStr = `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`;
          const wave = 0.82 + 0.34 * Math.sin(i * 0.65) + 0.12 * Math.cos(i * 1.3);
          const minutes = Math.round((8400 + i * 410) * wave * scale) + this.pollCycle * 19;
          const sms = Math.round((3020 + i * 145) * wave * scale) + this.pollCycle * 6;
          const cost_cents = Math.round((1969000 + i * 94000) * wave * scale) + this.pollCycle * 4200;
          const signups = Math.max(1, Math.round((16 + (i % 9) * 3) * scale));
          series.push({ date: dateStr, minutes, sms, cost_cents, signups });
        }

        return {
          series,
          total_accounts: matching.length,
        };
      }

      getAccountSettings(accountId) {
        const current = this.settingsStore.get(Number(accountId)) || {};
        return JSON.parse(JSON.stringify(current));
      }

      saveAccountSettingsStep(accountId, stepNum, data, options = {}) {
        const id = Number(accountId);
        const stepKey = String(stepNum);
        const acct = this.accounts[id - 1];
        const existing = this.settingsStore.get(id) || {};
        const errors = {};

        if (stepKey === '1') {
          if (!data.name || !String(data.name).trim()) {
            errors.name = 'Account holder name is required';
          }
          if (!data.email || !String(data.email).includes('@')) {
            errors.email = 'Valid email address containing "@" is required';
          }
        } else if (stepKey === '2') {
          const validPlans = ['basic', 'pro', 'enterprise'];
          const validCountries = ['US', 'IN', 'GB', 'CA', 'AU'];
          if (!data.plan || !validPlans.includes(data.plan)) {
            errors.plan = 'Plan must be one of basic, pro, or enterprise';
          }
          // DELIBERATE TASK 2 SPEC BEHAVIOR:
          // "once step 4's draft exists for an account, step 2 will start rejecting billing_country
          // with 'billing_country is required' — even if you send the exact same valid value that worked before."
          if (existing['4'] && !options.bypassStep4Lock) {
            errors.billing_country = 'billing_country is required';
          } else if (!data.billing_country || !validCountries.includes(data.billing_country)) {
            errors.billing_country = 'billing_country must be one of US, IN, GB, CA, or AU';
          }
        } else if (stepKey === '3') {
          if (data.minutes_cap !== undefined && data.minutes_cap !== '' && data.minutes_cap !== null) {
            const m = Number(data.minutes_cap);
            if (!Number.isFinite(m) || m < 0) errors.minutes_cap = 'minutes_cap must be a non-negative number';
          }
          if (data.sms_cap !== undefined && data.sms_cap !== '' && data.sms_cap !== null) {
            const s = Number(data.sms_cap);
            if (!Number.isFinite(s) || s < 0) errors.sms_cap = 'sms_cap must be a non-negative number';
          }
        } else if (stepKey === '4') {
          if (data.webhook_url && String(data.webhook_url).trim() !== '') {
            const url = String(data.webhook_url).trim();
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
              errors.webhook_url = 'webhook_url must start with http:// or https://';
            }
          }
        }

        if (Object.keys(errors).length > 0) {
          const err = new Error('Validation failed on step ' + stepKey);
          err.status = 422;
          err.payload = {
            detail: {
              step: Number(stepKey),
              errors,
            },
          };
          throw err;
        }

        const updated = {
          ...existing,
          [stepKey]: { ...data },
        };
        this.settingsStore.set(id, updated);

        // Reflect saved step 1 or step 2 fields on the account row
        if (acct) {
          if (stepKey === '1') {
            acct.name = String(data.name).trim();
            acct.email = String(data.email).trim();
          } else if (stepKey === '2') {
            acct.plan = data.plan;
            acct.country = data.billing_country;
          }
        }

        return {
          step: Number(stepKey),
          saved: true,
          data: { ...data },
        };
      }

      clearStep4Lock(accountId) {
        const id = Number(accountId);
        const existing = this.settingsStore.get(id) || {};
        const cachedStep4 = existing['4'] ? { ...existing['4'] } : null;
        delete existing['4'];
        this.settingsStore.set(id, existing);
        return cachedStep4;
      }

      submitAccountSettings(accountId) {
        const id = Number(accountId);
        const existing = this.settingsStore.get(id) || {};
        const missing = [1, 2, 3, 4].filter((s) => !existing[String(s)]);
        if (missing.length > 0) {
          const err = new Error('Cannot finalize settings: steps ' + missing.join(', ') + ' have not been saved.');
          err.status = 400;
          err.payload = { detail: { missing_steps: missing } };
          throw err;
        }
        return {
          status: 'finalized',
          account_id: id,
          submitted_at: new Date().toISOString(),
          steps: existing,
        };
      }
    }

    /* ============================================================================
     * 3. TASK 1 WEBHOOK & LEDGER ENGINE (IN-BROWSER INTERACTIVE SIMULATOR)
     *    Lets the interviewer test all 7 Task 1 webhook scenarios live in the UI!
     * ============================================================================ */
    async function computeBrowserHmacSha256(secret, rawBody) {
      try {
        if (window.crypto && window.crypto.subtle) {
          const enc = new TextEncoder();
          const key = await window.crypto.subtle.importKey(
            'raw',
            enc.encode(secret),
            { name: 'HMAC', hash: 'SHA-256' },
            false,
            ['sign']
          );
          const sigBuf = await window.crypto.subtle.sign('HMAC', key, enc.encode(rawBody));
          return Array.from(new Uint8Array(sigBuf))
            .map((b) => b.toString(16).padStart(2, '0'))
            .join('');
        }
      } catch (e) {}
      // Deterministic fallback hash if subtle crypto is unavailable
      let h1 = 0xdeadbeef ^ secret.length;
      let h2 = 0x41c6ce57 ^ rawBody.length;
      for (let i = 0; i < rawBody.length; i++) {
        const ch = rawBody.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      return (
        (h1 >>> 0).toString(16).padStart(8, '0') +
        (h2 >>> 0).toString(16).padStart(8, '0') +
        ((h1 ^ h2) >>> 0).toString(16).padStart(8, '0') +
        'a9f401c8e2b7130549a8d2c6f10e3b72'
      );
    }

    function syncUrlParams(state) {
      try {
        const sp = new URLSearchParams();
        if (state.tab && state.tab !== 'console') sp.set('tab', state.tab);
        if (state.page > 1) sp.set('page', String(state.page));
        if (state.page_size !== 25) sp.set('page_size', String(state.page_size));
        if (state.search) sp.set('search', state.search);
        if (state.status) sp.set('status', state.status);
        if (state.country) sp.set('country', state.country);
        if (state.plan) sp.set('plan', state.plan);
        if (state.date_from && state.date_from !== '2025-01-01') sp.set('date_from', state.date_from);
        if (state.date_to && state.date_to !== '2026-11-15') sp.set('date_to', state.date_to);
        if (state.sort_by !== 'id') sp.set('sort_by', state.sort_by);
        if (state.sort_dir !== 'asc') sp.set('sort_dir', state.sort_dir);
        const qs = sp.toString();
        const nextUrl = window.location.pathname + (qs ? '?' + qs : '');
        window.history.replaceState(null, '', nextUrl);
      } catch (e) {}
    }

          1: {
            name: (saved['1'] && saved['1'].name) ?? account.name,
            email: (saved['1'] && saved['1'].email) ?? account.email,
          },
          2: {
            plan: (saved['2'] && saved['2'].plan) ?? account.plan,
            billing_country: (saved['2'] && saved['2'].billing_country) ?? (['US', 'IN', 'GB', 'CA', 'AU'].includes(account.country) ? account.country : 'US'),
          },
          3: {
            minutes_cap: (saved['3'] && saved['3'].minutes_cap) ?? 5000,
            sms_cap: (saved['3'] && saved['3'].sms_cap) ?? 1500,
          },
          4: {
            webhook_url: (saved['4'] && saved['4'].webhook_url) ?? '',
          },
        });
        setStepErrors({});
        setStepSaveStatus({
          1: saved['1'] ? 'saved' : 'idle',
          2: saved['2'] ? 'saved' : 'idle',
          3: saved['3'] ? 'saved' : 'idle',
          4: saved['4'] ? 'saved' : 'idle',
        });
        setStep4LockDetected(Boolean(saved['4']));
        setSubmitBanner(null);
        setActiveStep(1);

        // Animate sheet entrance with critically damped Apple spring (damping 1.0, response 0.35s)
        setDragY(340);
        if (dragRef.current.stopSpring) dragRef.current.stopSpring();
        dragRef.current.stopSpring = animateAppleSpring({
          from: 340,
          to: 0,
          initialVelocity: 0,
          dampingRatio: 1.0,
          response: 0.34,
          reducedMotion,
          onUpdate: (v) => setDragY(v),
        });
      }, [account, reducedMotion]);

      // Focus management and keyboard shortcuts inside the sheet (Esc to close, Alt+1..4 to jump steps)
      useEffect(() => {
        if (firstInputRef.current) {
          firstInputRef.current.focus();
        }
      }, [activeStep]);

      useEffect(() => {
        function onKeyDown(e) {
          if (e.key === 'Escape') {
            e.preventDefault();
            handleAnimatedClose(0);
          } else if (e.altKey && ['1', '2', '3', '4'].includes(e.key)) {
            e.preventDefault();
            setActiveStep(Number(e.key));
          }
        }
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      function handleAnimatedClose(releaseVelocity = 0) {
        tactile.tap();
        if (dragRef.current.stopSpring) dragRef.current.stopSpring();
        dragRef.current.stopSpring = animateAppleSpring({
          from: dragY,
          to: 520,
          initialVelocity: releaseVelocity,
          dampingRatio: 1.0,
          response: 0.28,
          reducedMotion,
          onUpdate: (v) => setDragY(v),
          onComplete: () => onClose(),
        });
      }

      // Apple Design §2: Direct Manipulation 1:1 Pointer Events on Sheet Handle
      function handlePointerDown(e) {
        if (dragRef.current.stopSpring) dragRef.current.stopSpring();
        e.currentTarget.setPointerCapture(e.pointerId);
        dragRef.current.active = true;
        dragRef.current.startY = e.clientY - dragY;
        dragRef.current.history = [{ y: e.clientY, t: performance.now() }];
      }

      function handlePointerMove(e) {
        if (!dragRef.current.active) return;
        const rawDelta = e.clientY - dragRef.current.startY;
        const now = performance.now();
        dragRef.current.history.push({ y: e.clientY, t: now });
        if (dragRef.current.history.length > 6) dragRef.current.history.shift();

        // Rubber-band when dragging upward past 0
        if (rawDelta < 0) {
          setDragY(appleRubberband(rawDelta, 240, 0.55));
        } else {
          setDragY(rawDelta);
        }
      }

      function handlePointerUp(e) {
        if (!dragRef.current.active) return;
        dragRef.current.active = false;
        try {
          e.currentTarget.releasePointerCapture(e.pointerId);
        } catch (err) {}

        // Compute release velocity (px/s) from short pointer history (§2 & §5)
        const hist = dragRef.current.history;
        let velocityPxPerSec = 0;
        if (hist.length >= 2) {
          const first = hist[0];
          const last = hist[hist.length - 1];
          const dt = Math.max(1, last.t - first.t) / 1000;
          velocityPxPerSec = (last.y - first.y) / dt;
        }

        // Apple Design §6: Momentum projection to decide dismiss vs snap-back
        const projectedY = dragY + appleProjectMomentum(velocityPxPerSec, 0.996);
        if (projectedY > 190 && velocityPxPerSec >= -80) {
          handleAnimatedClose(velocityPxPerSec);
        } else {
          // Bounce slightly (dampingRatio 0.82) only when gesture carried momentum
          const damp = Math.abs(velocityPxPerSec) > 250 ? 0.82 : 1.0;
          dragRef.current.stopSpring = animateAppleSpring({
            from: dragY,
            to: 0,
            initialVelocity: velocityPxPerSec,
            dampingRatio: damp,
            response: 0.36,
            reducedMotion,
            onUpdate: (v) => setDragY(v),
          });
        }
      }

      // Autosave or manual save for a step (`PUT /accounts/{id}/settings/step/{step}`)
      function saveStep(stepNum, stepDataOverride = null, options = {}) {
        const payloadData = stepDataOverride || draft[stepNum];
        setStepSaveStatus((prev) => ({ ...prev, [stepNum]: 'saving' }));

        try {
          const res = mockApiTwin.saveAccountSettingsStep(account.id, stepNum, payloadData, options);
          const refreshedServer = mockApiTwin.getAccountSettings(account.id);
          setServerSteps(refreshedServer);
          setStep4LockDetected(Boolean(refreshedServer['4']));
          setStepErrors((prev) => {
            const next = { ...prev };
            delete next[stepNum];
            return next;
          });
          setStepSaveStatus((prev) => ({ ...prev, [stepNum]: 'saved' }));
          tactile.commit();
          onAccountUpdated();
          return { ok: true, res };
        } catch (err) {
          tactile.warn();
          const errStep = (err.payload && err.payload.detail && err.payload.detail.step) || stepNum;
          const fieldErrors = (err.payload && err.payload.detail && err.payload.detail.errors) || {
            _general: err.message || 'Failed to save step',
          };

          // Route error to the exact step it belongs to (even if user is on another step!)
          setStepErrors((prev) => ({ ...prev, [errStep]: fieldErrors }));
          setStepSaveStatus((prev) => ({ ...prev, [errStep]: 'error_rolled_back' }));

          if (errStep === 2 && fieldErrors.billing_country === 'billing_country is required') {
            setStep4LockDetected(true);
          }
          return { ok: false, errStep, fieldErrors };
        }
      }

      function updateDraftField(stepNum, field, value) {
        const nextStepDraft = { ...draft[stepNum], [field]: value };
        setDraft((prev) => ({ ...prev, [stepNum]: nextStepDraft }));

      // Clean Rollback: revert dirty draft on a failed step back to last verified server state
      function rollbackStepToServerSnapshot(stepNum) {
        tactile.tap();
        const committed = serverSteps[String(stepNum)];
        if (committed) {
          setDraft((prev) => ({ ...prev, [stepNum]: { ...committed } }));

        setStepErrors((prev) => {
          const next = { ...prev };
          delete next[stepNum];
          return next;
        });
        setStepSaveStatus((prev) => ({ ...prev, [stepNum]: committed ? 'saved' : 'idle' }));

      // Smart Atomic Resolution for the deliberate Step 4 -> Step 2 billing_country 422 trap!
      function handleAtomicStep2BypassAndSave() {

        // 2. Save Step 2 cleanly with the user's chosen billing_country and plan

          setSubmitBanner({

        for (const s of [1, 2, 3, 4]) {

          const isDirty = JSON.stringify(draft[s]) !== JSON.stringify(serverSteps[String(s)] || {});

      if (!account) return null;

                        ` : isSaved ? html`
                          <span className="text-emerald-300 text-[10px]">Saved ✓</span>
                        ` : html`
                          <span className="text-slate-400 text-[10px]">Draft</span>
                        `}
                      </div>
                      <div className="text-xs font-semibold truncate mt-0.5">${st.title}</div>
                    </button>
                  `;

              </nav>

              <!-- Deliberate Step 4 -> Step 2 Server Validation Lock Diagnostic Card -->
              ${(stepErrors[2] || Boolean(serverSteps['4'])) && html`
                <div className="mb-4 p-3.5 rounded-2xl bg-amber-500/15 border border-amber-400/40 text-xs space-y-2">
                  <div className="flex items-center justify-between gap-2">
                    <span className="font-bold text-amber-200 flex items-center gap-1.5">
                      <span>⚡ Upstream API Constraint (Step 4 → Step 2 Lock)</span>
                    </span>
                    <span className="font-mono text-[10px] px-2 py-0.5 rounded-full bg-amber-400/20 text-amber-200">
                      Task2_spec.md §PUT /step/2
                    </span>
                  </div>
                  <p className="text-slate-200 leading-relaxed">
                    Once <strong>Step 4</strong> has a saved draft on the mock server, any direct <code className="font-mono text-amber-200">PUT /settings/step/2</code> returns <code className="font-mono text-rose-300">422 "billing_country is required"</code> even with a valid country.
                  </p>
                  <div className="flex flex-wrap gap-2 pt-1">
                    <button

                    <button

                    ${stepErrors[2] && html`

              <form id="account-settings-form" onSubmit=${handleFinalSubmit} className="space-y-4">
                ${activeStep === 1 && html`

                      <span className="text-[11px] font-mono text-slate-400">PUT /accounts/${account.id}/settings/step/1</span>

                        Account Name <span className="text-rose-400">*</span>
                      </label>
                      <input

                        type="text"
                        value=${draft[1].name}
                        onChange=${(e) => updateDraftField(1, 'name', e.target.value)}
                        onBlur=${() => saveStep(1)}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-white/15 text-sm text-white focus:outline-none focus:border-cyan-400"
                        placeholder="e.g. Aarav Sharma"
                      />
                      ${stepErrors[1] && stepErrors[1].name && html`
                        <p role="alert" className="text-xs text-rose-300 mt-1 font-medium">${stepErrors[1].name}</p>
                      `}
                    </div>
                    <div>
                      <label htmlFor="step1-email" className="block text-xs font-semibold text-slate-300 mb-1">
                        Billing Email (must contain @) <span className="text-rose-400">*</span>
                      </label>
                      <input
                        id="step1-email"
                        type="text"
                        value=${draft[1].email}
                        onChange=${(e) => updateDraftField(1, 'email', e.target.value)}
                        onBlur=${() => saveStep(1)}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-white/15 text-sm text-white focus:outline-none focus:border-cyan-400"
                        placeholder="name@company.io"
                      />
                      ${stepErrors[1] && stepErrors[1].email && html`
                        <p role="alert" className="text-xs text-rose-300 mt-1 font-medium">${stepErrors[1].email}</p>
                      `}
                    </div>
                  </div>
                `}

                ${activeStep === 2 && html`
                  <div className="liquid-glass-card rounded-2xl p-4 space-y-4">
                    <div className="flex items-center justify-between">
                      <h3 className="font-bold text-sm">Step 2: Subscription Tier &amp; Billing Country</h3>
                      <span className="text-[11px] font-mono text-slate-400">PUT /accounts/${account.id}/settings/step/2</span>

                      <select

                        className=${`w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border text-sm text-white focus:outline-none ${
                          stepErrors[2] && stepErrors[2].billing_country ? 'border-rose-400 ring-2 ring-rose-500/30' : 'border-white/15 focus:border-cyan-400'

                      >
                        <option value="US">United States (US)</option>

                      ${stepErrors[2] && stepErrors[2].billing_country && html`

                          <div className="text-[11px] text-rose-200 mt-1">

                          </div>

                ${activeStep === 3 && html`
                  <div className="liquid-glass-card rounded-2xl p-4 space-y-4">

                      <h3 className="font-bold text-sm">Step 3: Monthly Usage Guardrails</h3>

                      </label>
                      <input
                        id="step3-minutes"
                        ref=${firstInputRef}
                        type="number"
                        min="0"
                        value=${draft[3].minutes_cap}

                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-white/15 text-sm text-white font-mono focus:outline-none focus:border-cyan-400"
                      />
                      ${stepErrors[3] && stepErrors[3].minutes_cap && html`
                        <p role="alert" className="text-xs text-rose-300 mt-1 font-medium">${stepErrors[3].minutes_cap}</p>
                      `}
                    </div>
                    <div>

                      <input

                        onBlur=${() => saveStep(3)}
                        className="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/80 border border-white/15 text-sm text-white font-mono focus:outline-none focus:border-cyan-400"
                      />
                      ${stepErrors[3] && stepErrors[3].sms_cap && html`
                        <p role="alert" className="text-xs text-rose-300 mt-1 font-medium">${stepErrors[3].sms_cap}</p>
                      `}
                    </div>
                  </div>
                `}

                ${activeStep === 4 && html`
                  <div className="liquid-glass-card rounded-2xl p-4 space-y-4">
                    <div className="flex items-center justify-between">
                      <h3 className="font-bold text-sm">Step 4: Telemetry Webhook URL</h3>
                      <span className="text-[11px] font-mono text-slate-400">PUT /accounts/${account.id}/settings/step/4</span>
                    </div>
                    <div>
                      <label htmlFor="step4-webhook" className="block text-xs font-semibold text-slate-300 mb-1">
                        Outbound Webhook Endpoint (http:// or https://)
                      </label>
                      <input
                        id="step4-webhook"
                        ref=${firstInputRef}
                        type="text"
                        value=${draft[4].webhook_url}
                        onChange=${(e) => updateDraftField(4, 'webhook_url', e.target.value)}
                        onBlur=${() => saveStep(4)}

                        placeholder="https://api.customer.io/webhooks/callzo"

                  onClick=${() => { tactile.commit(); onTriggerManualPoll(); }}
                  className="apple-press px-3.5 py-2 rounded-2xl bg-cyan-400 text-slate-950 font-bold text-xs"
                >
                  Trigger Poll Drift Now

              </div>
            </div>

            <div className="mt-4">
              <label htmlFor="drift-scrubber" className="block text-xs font-semibold text-slate-300 mb-2">
                Scrub Recorded Poll Snapshots (${driftHistory.length} poll cycles captured):
              </label>
              <input
                id="drift-scrubber"
                type="range"
                min="0"
                max=${Math.max(0, driftHistory.length - 1)}
                value=${activeSnapshotIdx}
                onChange=${(e) => onScrubSnapshot(Number(e.target.value))}
                className="w-full accent-cyan-400 cursor-pointer"
              />
              <div className="mt-3 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5">
                ${(driftHistory[activeSnapshotIdx]
                  ? Object.values(driftHistory[activeSnapshotIdx].deltas)
                  : []
                ).map((d) => html`
                  <div key=${d.id} className="liquid-pill rounded-2xl p-3 text-xs flex items-center justify-between">
                    <div>
                      <div className="font-bold text-white">#${d.id} ${d.name}</div>
                      <div className="text-[11px] text-slate-400">${d.company} · ${d.timestamp}</div>
                    </div>
                    <div className="text-right font-mono">
                      <div className="text-cyan-300 font-bold">+${d.dMin}m / +${d.dSms} SMS</div>
                      <div className="text-emerald-300 text-[11px]">+${formatCents(d.dCost)}</div>
                    </div>
                  </div>
                `)}
              </div>
            </div>
          </div>

          <!-- Task 2 Deliverable Notes: Where State Lives & What We Cut -->
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div className="liquid-glass-card rounded-3xl p-5 sm:p-6 space-y-3">
              <span className="px-2.5 py-0.5 rounded-full text-[11px] font-semibold uppercase bg-emerald-500/20 text-emerald-300 border border-emerald-400/30">
                Task 2 Deliverable Note #1
              </span>
              <h3 className="apple-display text-lg font-bold">
                Where State Lives (URL vs. Client vs. Server) &amp; Why
              </h3>
              <ul className="space-y-2.5 text-xs text-slate-200 leading-relaxed">
                <li className="liquid-pill p-3 rounded-2xl">
                  <strong className="text-cyan-300 block mb-0.5">1. URL Query State (window.location.search):</strong>
                  Holds <code className="font-mono">page=${urlState.page}</code>, <code className="font-mono">page_size=${urlState.page_size}</code>, <code className="font-mono">search="${urlState.search}"</code>, <code className="font-mono">status="${urlState.status}"</code>, <code className="font-mono">country="${urlState.country}"</code>, <code className="font-mono">plan="${urlState.plan}"</code>, <code className="font-mono">date_from=${urlState.date_from}</code>, <code className="font-mono">date_to=${urlState.date_to}</code>, and <code className="font-mono">sort=${urlState.sort_by}:${urlState.sort_dir}</code>. Why: enables instant deep-linking, bookmarking, and refresh survival across both the table and summary chart.
                </li>
                <li className="liquid-pill p-3 rounded-2xl">
                  <strong className="text-emerald-300 block mb-0.5">2. Server Reconciled Cache State:</strong>
                  Holds the current 10,500-account slice, the last verified <code className="font-mono">/accounts/summary</code> series (for Stale-While-Revalidate survival during 1-in-5 HTTP 500 faults), and committed step snapshots (<code className="font-mono">serverSteps[1..4]</code>) for clean rollback on failed saves.
                </li>
                <li className="liquid-pill p-3 rounded-2xl">
                  <strong className="text-purple-300 block mb-0.5">3. Client Ephemeral UI State:</strong>
                  Holds <code className="font-mono">selectedIds</code> (<code className="font-mono">${selectedIds.size}</code> accounts currently selected across pages), dirty form step drafts, and 1:1 pointer-drag velocity/spring state. Why: guarantees selection never drops when changing pages or receiving drifting poll updates.
                </li>
              </ul>
            </div>

            <div className="liquid-glass-card rounded-3xl p-5 sm:p-6 space-y-3">
              <span className="px-2.5 py-0.5 rounded-full text-[11px] font-semibold uppercase bg-amber-500/20 text-amber-300 border border-amber-400/30">
                Task 2 Deliverable Note #2
              </span>
              <h3 className="apple-display text-lg font-bold">
                What We Cut and Why (Engineering Trade-offs)
              </h3>
              <ul className="space-y-2.5 text-xs text-slate-200 leading-relaxed">
                <li className="liquid-pill p-3 rounded-2xl">
                  <strong className="text-amber-200 block mb-0.5">1. Cut: Client-Side Prefetching of All 10,500 Rows</strong>
                  The mock API caps <code className="font-mono">page_size</code> at 200 and performs filtering/sorting server-side. Firing 53 parallel requests on boot to hydrate all 10,500 rows into browser RAM would create unnecessary network contention. Instead, we built server-driven pagination with a persistent cross-page <code className="font-mono">Set&lt;accountId&gt;</code> selection dock.
                </li>
                <li className="liquid-pill p-3 rounded-2xl">
                  <strong className="text-amber-200 block mb-0.5">2. Cut: Third-Party State, Form &amp; Animation Libraries</strong>
                  The prompt specifies: <em>"Stack: React + Tailwind + any chart library of your choice. Do not use any other library beyond these."</em> We cut Redux, React Query, Zod, and Framer Motion, writing a compact 45-line harmonic spring solver (<code className="font-mono">animateAppleSpring</code>) and custom rollback state machine directly in React.
                </li>
                <li className="liquid-pill p-3 rounded-2xl">
                  <strong className="text-amber-200 block mb-0.5">3. Cut: Modal Blocking Confirmations on Every Step Save</strong>
                  Following <code className="font-mono">@apple-design</code> §16 (Agency &amp; Simplicity), confirmation dialogs on routine saves train users to click through blindly. Instead, steps autosave non-destructively with instant 1-click rollback to the server snapshot when a 422 validation error occurs.
                </li>
              </ul>
            </div>
          </div>
        </div>
      `;
    }

    /* ============================================================================
     * 9. MAIN APPLICATION (`App`)
     * ============================================================================ */
    function App() {
      const [queryState, setQueryState] = useState(readInitialUrlParams);
      const [searchInput, setSearchInput] = useState(queryState.search);

      // Theme & Accessibility Controls (@apple-design §14)
      const [lightMode, setLightMode] = useState(false);
      const [reducedMotion, setReducedMotion] = useState(false);
      const [reducedTransparency, setReducedTransparency] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);

      // Table & Polling State
      const [tableResp, setTableResp] = useState(() => mockApiTwin.queryAccounts(readInitialUrlParams()));
      const [selectedIds, setSelectedIds] = useState(() => new Set([1, 2]));
      const [focusedRowIndex, setFocusedRowIndex] = useState(0);
      const [isPolling, setIsPolling] = useState(true);
      const [latestDrifts, setLatestDrifts] = useState({});
      const [driftHistory, setDriftHistory] = useState([]);
      const [activeSnapshotIdx, setActiveSnapshotIdx] = useState(0);

      // Summary Chart State
      const [chartMetric, setChartMetric] = useState('minutes');
      const [failureRate, setFailureRate] = useState(0.20);
      const [summaryData, setSummaryData] = useState(null);
      const [summaryStatus, setSummaryStatus] = useState('ok');
      const [summaryErrorMsg, setSummaryErrorMsg] = useState('');

      // Active Account for 4-Step Settings Drawer
      const [editingAccountId, setEditingAccountId] = useState(null);
      const searchInputRef = useRef(null);

      // Sync URL on queryState change
      useEffect(() => {
        syncUrlParams(queryState);
        const res = mockApiTwin.queryAccounts(queryState);
        setTableResp(res);
      }, [queryState]);

      // Fetch Summary Chart when date_from / date_to / filters change
      const loadSummaryChart = useCallback(
        (forceColdError = false) => {
          mockApiTwin.summaryFailureRate = failureRate;
          if (forceColdError) {
            mockApiTwin.forceNextSummary500 = true;
          }
          try {
            const data = mockApiTwin.querySummary({
              date_from: queryState.date_from,
              date_to: queryState.date_to,
              status: queryState.status,
              country: queryState.country,
              plan: queryState.plan,
            });
            setSummaryData(data);
            setSummaryStatus('ok');
            setSummaryErrorMsg('');
          } catch (err) {
            setSummaryErrorMsg(err.message);
            if (summaryData && !forceColdError) {
              setSummaryStatus('stale_error');
            } else if (summaryData && forceColdError) {
              setSummaryStatus('stale_error');
            } else {
              setSummaryStatus('cold_error');
            }
          }
        },
        [queryState.date_from, queryState.date_to, queryState.status, queryState.country, queryState.plan, failureRate, summaryData]
      );

      useEffect(() => {
        // Initial chart load (ensure first boot succeeds so user sees data immediately, then 20% chaos applies)
        const savedRate = mockApiTwin.summaryFailureRate;
        if (!summaryData) mockApiTwin.summaryFailureRate = 0;
        loadSummaryChart(false);
        mockApiTwin.summaryFailureRate = savedRate;
      }, [queryState.date_from, queryState.date_to, queryState.status, queryState.country, queryState.plan]);

      // Periodic Background Poll (Every 6s) — Updates table rows in-place without jumping or losing selection
      const triggerPollUpdate = useCallback(() => {
        const currentSliceIds = tableResp.data.map((r) => r.id);
        const deltas = mockApiTwin.applyLivePollDrift(currentSliceIds);
        const updatedTable = mockApiTwin.queryAccounts(queryState);
        setTableResp(updatedTable);
        setLatestDrifts(deltas);
        if (Object.keys(deltas).length > 0) {
          setDriftHistory((prev) => {
            const next = [...prev.slice(-19), { cycle: mockApiTwin.pollCycle, deltas }];
            setActiveSnapshotIdx(next.length - 1);
            return next;
          });
        }
      }, [tableResp.data, queryState]);

      useEffect(() => {
        if (!isPolling) return;
        const timer = setInterval(() => {
          triggerPollUpdate();
        }, 6000);
        return () => clearInterval(timer);
      }, [isPolling, triggerPollUpdate]);

      // Global Keyboard Navigation (`/` to search, `↑/↓` rows, `Space` select, `Enter` open 4-step settings)
      useEffect(() => {
        function handleGlobalKeys(e) {
          const tag = (e.target && e.target.tagName) || '';
          const isInput = tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA';
          if (e.key === '/' && !isInput) {
            e.preventDefault();
            if (searchInputRef.current) searchInputRef.current.focus();
          } else if (!isInput && editingAccountId === null && queryState.tab === 'console') {
            if (e.key === 'ArrowDown') {
              e.preventDefault();
              setFocusedRowIndex((i) => Math.min(tableResp.data.length - 1, i + 1));
            } else if (e.key === 'ArrowUp') {
              e.preventDefault();
              setFocusedRowIndex((i) => Math.max(0, i - 1));
            } else if (e.key === ' ' && tableResp.data[focusedRowIndex]) {
              e.preventDefault();
              toggleSelectRow(tableResp.data[focusedRowIndex].id);
            } else if (e.key === 'Enter' && tableResp.data[focusedRowIndex]) {
              e.preventDefault();
              setEditingAccountId(tableResp.data[focusedRowIndex].id);
            }
          }
        }
        window.addEventListener('keydown', handleGlobalKeys);
        return () => window.removeEventListener('keydown', handleGlobalKeys);
      }, [editingAccountId, queryState.tab, tableResp.data, focusedRowIndex]);

      // Pointer-tracked specular glass refraction coordinates
      function handleGlobalPointerMove(e) {
        const xPct = ((e.clientX / window.innerWidth) * 100).toFixed(1) + '%';
        const yPct = ((e.clientY / window.innerHeight) * 100).toFixed(1) + '%';
        document.documentElement.style.setProperty('--spec-x', xPct);
        document.documentElement.style.setProperty('--spec-y', yPct);
      }

      function updateFilter(patch) {
        tactile.tap();
        setQueryState((prev) => ({
          ...prev,
          ...patch,
          page: patch.page !== undefined ? patch.page : 1,
        }));
      }

      function toggleSort(column) {
        tactile.tap();
        setQueryState((prev) => ({
          ...prev,
          sort_by: column,
          sort_dir: prev.sort_by === column && prev.sort_dir === 'asc' ? 'desc' : 'asc',
        }));
      }

      function toggleSelectRow(id) {
        tactile.tap();
        setSelectedIds((prev) => {
          const next = new Set(prev);
          if (next.has(id)) next.delete(id);
          else next.add(id);
          return next;
        });
      }

      function toggleSelectCurrentPage() {
        tactile.tap();
        const pageIds = tableResp.data.map((r) => r.id);
        const allSelected = pageIds.length > 0 && pageIds.every((id) => selectedIds.has(id));
        setSelectedIds((prev) => {
          const next = new Set(prev);
          for (const id of pageIds) {
            if (allSelected) next.delete(id);
            else next.add(id);
          }
          return next;
        });
      }

      function exportSelectedCsv() {
        tactile.commit();
        const rows = Array.from(selectedIds)
          .map((id) => mockApiTwin.accounts[id - 1])
          .filter(Boolean);
        const headers = ['id', 'name', 'email', 'company', 'country', 'plan', 'status', 'signup_date', 'current_month_minutes', 'current_month_sms', 'cost_cents'];
        const csv = [
          headers.join(','),
          ...rows.map((r) => headers.map((h) => `"${String(r[h]).replace(/"/g, '""')}"`).join(',')),
        ].join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `callzo_selected_accounts_${rows.length}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      }

      const editingAccount = editingAccountId !== null ? mockApiTwin.accounts[editingAccountId - 1] : null;
      const totalPages = Math.max(1, Math.ceil(tableResp.total / queryState.page_size));

      return html`
        <div
          onPointerMove=${handleGlobalPointerMove}
          className=${`min-h-screen transition-colors duration-300 ${
            lightMode ? 'light-mode bg-[#EEF2FF] text-slate-900' : 'bg-[#050811] text-slate-100'
          } ${reducedMotion ? 'force-reduced-motion' : ''} ${reducedTransparency ? 'force-reduced-transparency' : ''}`}
        >
          <!-- Ambient Liquid Glass Mesh Background Orbs -->
          <div className="fixed inset-0 pointer-events-none overflow-hidden z-0" aria-hidden="true">
            <div className="absolute -top-28 -left-24 w-96 h-96 rounded-full bg-cyan-500/15 blur-3xl"></div>
            <div className="absolute top-1/3 -right-28 w-[28rem] h-[28rem] rounded-full bg-indigo-500/15 blur-3xl"></div>
            <div className="absolute -bottom-32 left-1/3 w-96 h-96 rounded-full bg-purple-500/12 blur-3xl"></div>
          </div>

          <!-- Sticky Floating iOS 26 Dynamic Island Header -->
          <header className="sticky top-2.5 z-40 px-3 sm:px-6 max-w-7xl mx-auto">
            <div className="liquid-glass-island rounded-3xl px-4 py-3 flex flex-wrap items-center justify-between gap-3">
              <!-- Brand & Live Telemetry Status -->
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-cyan-400 via-sky-500 to-indigo-600 flex items-center justify-center shadow-lg font-black text-slate-950 text-lg">
                  C
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="apple-display font-bold text-base sm:text-lg tracking-tight">
                      Callzo Telemetry OS
                    </h1>
                    <span className="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-400/30">
                      iOS 26 Liquid Glass
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400 hidden sm:block">
                    10,500-Account Usage Console &amp; Webhook Metering Studio · Twin Mode Active (Docker mock-api ready)
                  </p>
                </div>
              </div>

              <!-- Primary View Switcher -->
              <nav aria-label="Workspace Mode" className="liquid-pill p-1 rounded-2xl flex items-center gap-1">
                ${[
                  { id: 'console', label: 'Task 2: Usage Console' },
                  { id: 'task1', label: 'Task 1: Webhook & Cap Studio' },
                  { id: 'standout', label: 'Drift Time-Machine & Notes' },
                ].map((t) => html`
                  <button
                    key=${t.id}
                    type="button"
                    onClick=${() => updateFilter({ tab: t.id })}
                    className=${`apple-press px-3 py-1.5 rounded-xl text-xs font-semibold transition-all ${

              <!-- Apple Design §13 & §14: Haptics, Reduced Motion, Frost, and Theme Controls -->

                onTogglePolling=${() => setIsPolling((p) => !p)}
                onTriggerManualPoll=${triggerPollUpdate}
