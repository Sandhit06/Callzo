                          });
                        }}
                        className="apple-press py-2 px-3 rounded-2xl liquid-pill text-xs font-semibold hover:bg-white/15"
                      >
                        Reset
                      </button>
                    </div>
                  </div>
                </div>

                <!-- Shared Date Range Filter Bar (Updates both Table & Summary Chart simultaneously) -->
                <div className="mt-3 pt-3 border-t border-white/10 flex flex-wrap items-center justify-between gap-3 text-xs">
                  <div className="flex flex-wrap items-center gap-2">
                    <span className="text-slate-400 font-semibold">Signup Date Range (Table + Chart):</span>
                    <label htmlFor="date-from" className="sr-only">Signup Date From</label>
                    <input
                      id="date-from"
                      type="date"
                      value=${queryState.date_from}
                      onChange=${(e) => updateFilter({ date_from: e.target.value })}
                      className="px-2.5 py-1 rounded-xl bg-slate-900/80 border border-white/15 text-white font-mono text-xs"
                    />
                    <span className="text-slate-400">to</span>
                    <label htmlFor="date-to" className="sr-only">Signup Date To</label>
                    <input
                      id="date-to"
                      type="date"
                      value=${queryState.date_to}
                      onChange=${(e) => updateFilter({ date_to: e.target.value })}
                      className="px-2.5 py-1 rounded-xl bg-slate-900/80 border border-white/15 text-white font-mono text-xs"
                    />
                    <div className="flex items-center gap-1 ml-1">
                      ${[
                        { label: 'All Time', from: '2025-01-01', to: '2026-11-15' },
                        { label: '2026 YTD', from: '2026-01-01', to: '2026-11-15' },
                        { label: 'H2 2025', from: '2025-07-01', to: '2025-12-31' },
                      ].map((preset) => html`
                        <button
                          key=${preset.label}
                          type="button"
                          onClick=${() => updateFilter({ date_from: preset.from, date_to: preset.to })}
                          className="apple-press px-2.5 py-1 rounded-xl liquid-pill text-[11px] font-semibold hover:bg-white/15"
                        >
                          ${preset.label}
                        </button>
                      `)}
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <span className="text-[11px] text-slate-400 font-mono">
                      Selected across all pages: <strong className="text-cyan-300">${selectedIds.size}</strong>
                    </span>
                    <button
                      type="button"
                      onClick=${exportSelectedCsv}
                      disabled=${selectedIds.size === 0}
                      className="apple-press px-3 py-1 rounded-xl bg-cyan-500/20 border border-cyan-400/30 text-cyan-200 font-semibold text-[11px] disabled:opacity-40"
                    >
                      Export Selected CSV (${selectedIds.size})
                    </button>
                  </div>
                </div>
              </section>

              <!-- Summary Telemetry Chart (With Deliberate 1-in-5 HTTP 500 Chaos Handling) -->
              <${LiquidGlassSummaryChart}
                summaryData=${summaryData}
                summaryStatus=${summaryStatus}
                summaryErrorMsg=${summaryErrorMsg}
                metricKey=${chartMetric}
                onMetricKeyChange=${setChartMetric}
                failureRate=${failureRate}
                onFailureRateChange=${setFailureRate}
                onForce500=${() => loadSummaryChart(true)}
                onRetry=${() => {
                  mockApiTwin.forceNextSummary500 = false;
                  const prevRate = mockApiTwin.summaryFailureRate;
                  mockApiTwin.summaryFailureRate = 0;
                  loadSummaryChart(false);
                  mockApiTwin.summaryFailureRate = prevRate;
                }}
                lightMode=${lightMode}
              />

              <!-- Server-Side Data Table (10,500 Accounts, Stable Selection, Live Poll Deltas, 375px Responsive) -->
              <section
                aria-label="Accounts Usage Data Table"
                className="liquid-glass-card rounded-3xl overflow-hidden"
              >
                <!-- Table Top Bar -->
                <div className="px-4 sm:px-6 py-4 border-b border-white/10 flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <div className="flex items-center gap-2">
                      <h2 className="apple-display text-base sm:text-lg font-bold">
                        Account Usage Ledger
                      </h2>
                      <span className="px-2.5 py-0.5 rounded-full text-xs font-mono font-semibold bg-white/10 text-cyan-300 tabular-nums">
                        ${tableResp.total.toLocaleString()} matching accounts
                      </span>
                    </div>
                    <p className="text-xs text-slate-400 mt-0.5">
                      Click any row or press <kbd className="px-1.5 py-0.5 rounded bg-white/10 font-mono text-[10px]">Enter</kbd> to open the 4-Step Settings Sheet. Row #2 has Step 4 pre-saved so you can test the Step 2 <code className="font-mono text-amber-300">billing_country</code> 422 trap immediately.
                    </p>
                  </div>

                  <div className="flex items-center gap-2 text-xs">
                    <button
                      type="button"
                      onClick=${() => { tactile.tap(); setEditingAccountId(2); }}
                      className="apple-press px-3 py-1.5 rounded-xl bg-amber-500/20 border border-amber-400/40 text-amber-200 font-semibold"
                    >
                      Inspect Account #2 (Step 4→2 Trap Demo)
                    </button>
                    <label htmlFor="page-size-select" className="text-slate-400">Rows:</label>
                    <select
                      id="page-size-select"
                      value=${queryState.page_size}
                      onChange=${(e) => updateFilter({ page_size: Number(e.target.value), page: 1 })}
                      className="px-2.5 py-1.5 rounded-xl bg-slate-900/80 border border-white/15 text-white font-mono"
                    >
                      <option value="10">10</option>
                      <option value="25">25</option>
                      <option value="50">50</option>
                      <option value="100">100</option>
                      <option value="200">200</option>
                    </select>
                  </div>
                </div>

                ${tableResp.data.length === 0 ? html`
                  <!-- Empty State -->
                  <div className="p-12 text-center space-y-3">
                    <div className="text-base font-bold text-slate-200">No accounts match your current filters</div>
                    <p className="text-xs text-slate-400 max-w-md mx-auto">
                      Try clearing your search query or expanding the signup date window. Your ${selectedIds.size} selected account(s) remain safely preserved in memory.
                    </p>
                    <button
                      type="button"
                      onClick=${() => {
                        setSearchInput('');
                        updateFilter({ search: '', status: '', country: '', plan: '', date_from: '2025-01-01', date_to: '2026-11-15' });
                      }}
                      className="apple-press px-4 py-2 rounded-2xl bg-cyan-400 text-slate-950 font-bold text-xs"
                    >
                      Reset All Filters
                    </button>
                  </div>
                ` : html`
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="border-b border-white/10 text-[11px] font-semibold uppercase apple-micro text-slate-400 bg-white/[0.02]">
                          <th className="py-3 pl-4 pr-2 w-10">
                            <input
                              type="checkbox"
                              aria-label="Select all accounts on current page"
                              checked=${tableResp.data.length > 0 && tableResp.data.every((r) => selectedIds.has(r.id))}
                              onChange=${toggleSelectCurrentPage}
                              className="rounded accent-cyan-400 cursor-pointer"
                            />
                          </th>
                          ${[
                            { key: 'id', label: 'ID' },
                            { key: 'name', label: 'Account / Email' },
                            { key: 'company', label: 'Company' },
                            { key: 'country', label: 'Region' },
                            { key: 'plan', label: 'Plan' },
                            { key: 'status', label: 'Status' },
                            { key: 'signup_date', label: 'Signup' },
                            { key: 'current_month_minutes', label: 'Minutes (Mo)', align: 'right' },
                            { key: 'current_month_sms', label: 'SMS (Mo)', align: 'right' },
                            { key: 'cost_cents', label: 'Spend ($)', align: 'right' },
                          ].map((col) => {
                            const isSorted = queryState.sort_by === col.key;
                            return html`
                              <th
                                key=${col.key}
                                className=${`py-3 px-3 ${col.align === 'right' ? 'text-right' : 'text-left'}`}
                              >
                                <button
                                  type="button"
                                  onClick=${() => toggleSort(col.key)}
                                  className=${`apple-press inline-flex items-center gap-1 hover:text-white ${
                                    isSorted ? 'text-cyan-300 font-bold' : ''
                                  }`}
                                >
                                  <span>${col.label}</span>
                                  <span className="text-[10px]">
                                    ${isSorted ? (queryState.sort_dir === 'asc' ? '↑' : '↓') : '↕'}
                                  </span>
                                </button>
                              </th>
                            `;
                          })}
                          <th className="py-3 pl-3 pr-4 text-right">Settings</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-white/5 text-xs">
                        ${tableResp.data.map((row, idx) => {
                          const isSelected = selectedIds.has(row.id);
                          const isFocused = focusedRowIndex === idx;
                          const drift = latestDrifts[row.id];
                          const savedStepsCount = Object.keys(mockApiTwin.getAccountSettings(row.id)).length;
                          return html`
                            <tr
                              key=${row.id}
                              onClick=${() => setFocusedRowIndex(idx)}
                              className=${`transition-colors ${
                                drift ? 'drift-flash' : ''
                              } ${
                                isSelected
                                  ? 'bg-cyan-500/12 hover:bg-cyan-500/18'
                                  : isFocused
                                  ? 'bg-white/[0.06]'
                                  : 'hover:bg-white/[0.04]'
                              }`}
                            >
                              <td className="py-3 pl-4 pr-2">
                                <input
                                  type="checkbox"
                                  aria-label=${`Select account ${row.name}`}
                                  checked=${isSelected}
                                  onChange=${() => toggleSelectRow(row.id)}
                                  onClick=${(e) => e.stopPropagation()}
                                  className="rounded accent-cyan-400 cursor-pointer"
                                />
                              </td>
                              <td className="py-3 px-3 font-mono font-bold text-slate-300 tabular-nums">
                                #${row.id}
                              </td>
                              <td className="py-3 px-3">
                                <div className="font-semibold text-white">${row.name}</div>
                                <div className="text-[11px] text-slate-400 font-mono">${row.email}</div>
                              </td>
                              <td className="py-3 px-3 text-slate-200">${row.company}</td>
                              <td className="py-3 px-3">
                                <span className="px-2 py-0.5 rounded-lg liquid-pill font-mono text-[11px]">
                                  ${row.country}
                                </span>
                              </td>
                              <td className="py-3 px-3">
                                <span className=${`px-2.5 py-0.5 rounded-full text-[11px] font-semibold capitalize ${
                                  row.plan === 'enterprise'
                                    ? 'bg-purple-500/20 text-purple-200 border border-purple-400/30'
                                    : row.plan === 'pro'
                                    ? 'bg-cyan-500/20 text-cyan-200 border border-cyan-400/30'
                                    : 'bg-slate-500/20 text-slate-300 border border-slate-400/25'
                                }`}>
                                  ${row.plan}
                                </span>
                              </td>
                              <td className="py-3 px-3">
                                <span className=${`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-semibold capitalize ${
                                  row.status === 'active'
                                    ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-400/30'
                                    : row.status === 'trial'
                                    ? 'bg-amber-500/15 text-amber-200 border border-amber-400/30'
                                    : 'bg-rose-500/15 text-rose-300 border border-rose-400/30'
                                }`}>
                                  <span className=${`w-1.5 h-1.5 rounded-full ${
                                    row.status === 'active' ? 'bg-emerald-400' : row.status === 'trial' ? 'bg-amber-400' : 'bg-rose-400'
                                  }`}></span>
                                  ${row.status}
                                </span>
                              </td>
                              <td className="py-3 px-3 font-mono text-slate-300 tabular-nums">
                                ${row.signup_date}
                              </td>
                              <td className="py-3 px-3 text-right font-mono tabular-nums">
                                <span className="font-semibold text-white">${row.current_month_minutes.toLocaleString()}</span>
                                ${drift && html`
                                  <span className="ml-1.5 px-1.5 py-0.5 rounded bg-cyan-500/20 text-cyan-300 text-[10px] font-bold">
                                    +${drift.dMin}
                                  </span>
                                `}
                              </td>
                              <td className="py-3 px-3 text-right font-mono tabular-nums">
                                <span>${row.current_month_sms.toLocaleString()}</span>
                                ${drift && html`
                                  <span className="ml-1.5 px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 text-[10px] font-bold">
                                    +${drift.dSms}
                                  </span>
                                `}
                              </td>
                              <td className="py-3 px-3 text-right font-mono font-bold text-cyan-300 tabular-nums">
                                <span>${formatCents(row.cost_cents)}</span>
                                ${drift && html`
                                  <span className="ml-1.5 px-1.5 py-0.5 rounded bg-purple-500/25 text-purple-200 text-[10px]">
                                    +${formatCents(drift.dCost)}
                                  </span>
                                `}
                              </td>
                              <td className="py-3 pl-3 pr-4 text-right">
                                <button
                                  type="button"
                                  onClick=${(e) => {
                                    e.stopPropagation();
                                    tactile.tap();
                                    setEditingAccountId(row.id);
                                  }}
                                  className="apple-press px-3 py-1.5 rounded-xl liquid-pill hover:bg-white/15 text-xs font-semibold inline-flex items-center gap-1.5"
                                >
                                  <span>Configure</span>
                                  ${savedStepsCount > 0 && html`
                                    <span className="px-1.5 py-0.2 rounded-full bg-cyan-500/25 text-cyan-200 font-mono text-[10px]">
                                      ${savedStepsCount}/4
                                    </span>
                                  `}
                                </button>
                              </td>
                            </tr>
                          `;
                        })}
                      </tbody>
                    </table>
                  </div>
                `}

                <!-- Pagination Footer -->
                <div className="px-4 sm:px-6 py-3.5 border-t border-white/10 flex flex-wrap items-center justify-between gap-3 text-xs">
                  <div className="text-slate-400 font-mono tabular-nums">
                    Showing page <strong className="text-white">${queryState.page}</strong> of <strong className="text-white">${totalPages}</strong> (${tableResp.total.toLocaleString()} total records · ${selectedIds.size} selected across pages)
                  </div>
                  <div className="flex items-center gap-1.5">
                    <button
                      type="button"
                      disabled=${queryState.page <= 1}
                      onClick=${() => updateFilter({ page: 1 })}
                      className="apple-press px-2.5 py-1.5 rounded-xl liquid-pill disabled:opacity-40 font-semibold"
                    >
                      « First
                    </button>
                    <button
                      type="button"
                      disabled=${queryState.page <= 1}
                      onClick=${() => updateFilter({ page: queryState.page - 1 })}
                      className="apple-press px-3 py-1.5 rounded-xl liquid-pill disabled:opacity-40 font-semibold"
                    >
                      ‹ Prev
                    </button>
                    <span className="px-3 py-1.5 rounded-xl bg-white/10 font-mono font-bold tabular-nums">
                      ${queryState.page} / ${totalPages}
                    </span>
                    <button
                      type="button"
                      disabled=${queryState.page >= totalPages}
                      onClick=${() => updateFilter({ page: queryState.page + 1 })}
                      className="apple-press px-3 py-1.5 rounded-xl liquid-pill disabled:opacity-40 font-semibold"
                    >
                      Next ›
                    </button>
                    <button
                      type="button"
                      disabled=${queryState.page >= totalPages}
                      onClick=${() => updateFilter({ page: totalPages })}
                      className="apple-press px-2.5 py-1.5 rounded-xl liquid-pill disabled:opacity-40 font-semibold"
                    >
                      Last »
                    </button>
                  </div>
                </div>
              </section>
            `}
          </main>

          <!-- Floating Cross-Page Selection Bar (Proves row selection stays 100% stable across pages & polls) -->
          ${selectedIds.size > 0 && html`
            <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-30 px-4 w-full max-w-xl">
              <div className="liquid-glass-island rounded-2xl px-4 py-2.5 flex items-center justify-between gap-3 text-xs">
                <div className="flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-cyan-400"></span>
                  <span className="font-semibold">
                    <strong className="font-mono text-cyan-300 tabular-nums">${selectedIds.size}</strong> account(s) pinned across pages &amp; background polls
                  </span>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick=${exportSelectedCsv}
                    className="apple-press px-3 py-1 rounded-xl bg-cyan-400 text-slate-950 font-bold"
                  >
                    Export CSV
                  </button>
                  <button
                    type="button"
                    onClick=${() => { tactile.tap(); setSelectedIds(new Set()); }}
                    className="apple-press px-2.5 py-1 rounded-xl liquid-pill text-slate-300 hover:text-white"
                  >
                    Clear Selection
                  </button>
                </div>
              </div>
            </div>
          `}

          <!-- 4-Step Account Settings Sheet -->
          ${editingAccount && html`
            <${AccountSettingsSheet}
              account=${editingAccount}
              onClose=${() => setEditingAccountId(null)}
              onAccountUpdated=${() => setTableResp(mockApiTwin.queryAccounts(queryState))}
              reducedMotion=${reducedMotion}
            />
          `}
        </div>
      `;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
