services:
  mock-api:
    image: meetrj/callzo-mock-usage-api
    platform: linux/arm64
    container_name: mock-api
    ports:
      - "8001:8001"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: callzo-task2-frontend:local
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - mock-api
